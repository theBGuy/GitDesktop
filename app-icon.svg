<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    GitDesktop app icon — full-bleed "app window" + git branch.
    Mint #4FE0C4 body + ink #0B2E35 title bar/branch. The window fills the
    whole icon (no padding) so the branch curve survives small sizes.
    Source of truth: design/logos/gitdesktop/final/gitdesktop-icon.svg.
    app-icon-macos.svg mirrors this artwork and is the source of icon.icns: apply
    artwork edits to both, and after `tauri icon` from this file, regenerate the
    .icns from the macOS variant (steps in that file).
  -->
  <rect width="1024" height="1024" rx="212" fill="#4FE0C4"/>
  <path d="M 0 240 V 212 A 212 212 0 0 1 212 0 H 812 A 212 212 0 0 1 1024 212 V 240 Z" fill="#0B2E35"/>
  <circle cx="156" cy="120" r="40" fill="#4FE0C4"/>
  <circle cx="286" cy="120" r="40" fill="#4FE0C4"/>
  <circle cx="416" cy="120" r="40" fill="#4FE0C4"/>
  <path d="M 332 440 V 832" stroke="#0B2E35" stroke-width="88" stroke-linecap="round" fill="none"/>
  <path d="M 332 626 C 332 478 566 438 724 436" stroke="#0B2E35" stroke-width="88" stroke-linecap="round" fill="none"/>
  <circle cx="332" cy="440" r="88" fill="#0B2E35"/>
  <circle cx="332" cy="832" r="88" fill="#0B2E35"/>
  <circle cx="752" cy="436" r="88" fill="#0B2E35"/>
</svg>
