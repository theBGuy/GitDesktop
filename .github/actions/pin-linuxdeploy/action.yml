name: Pin AppImage bundling tools
description: >-
  Seed the Tauri bundler's tool cache with SHA256-verified copies of its own
  linuxdeploy and AppRun builds.

# Cache names must match the bundler's tools, including LINUXDEPLOY_COMMIT_HASH.
# appimage-guard.sh checks that the bundler ran the pinned linuxdeploy and
# bundled the pinned AppRun, which the bundler copies unmodified.

runs:
  using: composite
  steps:
    - name: Seed the Tauri tool cache with pinned AppImage tools
      shell: bash
      env:
        LINUXDEPLOY_URL: https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
        LINUXDEPLOY_CACHE_NAME: linuxdeploy-07333c6-x86_64.AppImage
        LINUXDEPLOY_SHA256: 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
        APPRUN_URL: https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
        APPRUN_SHA256: f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
      run: |
        set -euo pipefail
        # The gate is arch-agnostic (runner.os); this pin is not.
        [ "$(uname -m)" = x86_64 ] || { echo "pin-linuxdeploy is x86_64-only"; exit 1; }
        cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
        target="$cache_dir/$LINUXDEPLOY_CACHE_NAME"
        mkdir -p "$cache_dir"
        curl -fsSL --retry 3 \
          -o "$target" \
          "$LINUXDEPLOY_URL"
        # The linuxdeploy hash is only valid at seed time: the bundler patches
        # its cached binary in place (dd zeroes 3 bytes) before running it.
        echo "${LINUXDEPLOY_SHA256}  ${target}" | sha256sum -c -
        chmod +x "$target"
        target="$cache_dir/AppRun-x86_64"
        curl -fsSL --retry 3 \
          -o "$target" \
          "$APPRUN_URL"
        echo "${APPRUN_SHA256}  ${target}" | sha256sum -c -
        chmod +x "$target"
        echo "GD_LINUXDEPLOY_PIN=$LINUXDEPLOY_CACHE_NAME" >> "$GITHUB_ENV"
        echo "GD_APPRUN_SHA256=$APPRUN_SHA256" >> "$GITHUB_ENV"
