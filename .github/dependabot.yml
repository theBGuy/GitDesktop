# Keeps dependencies up to date with weekly PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Frontend (pnpm) at the repo root.
  #
  # The npm updater converges on one version per dependency name across the whole
  # pnpm workspace and rewrites every manifest to it, so root and site/ have to
  # agree on a major: root tracks @vitejs/plugin-react's peer, site/ tracks the
  # vite astro depends on. Any `ignore` added here must be name-only — a
  # `versions:` bound writes the wrong major into the other manifest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Hold off on freshly-published releases (supply-chain safety). pnpm's
    # minimumReleaseAge in pnpm-workspace.yaml is the same idea for direct
    # installs, on its own never-longer delay, not kept in step with these.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Tauri's npm and crate halves must reach master in ONE commit: a group
      # cannot span ecosystems, so combine this PR with its cargo twin. Majors
      # are grouped too, unlike the ordinary deps below, because that bump
      # moves both halves; a minor or major split reddens the parity gate, a
      # patch-only one passes by design. A package with no counterpart
      # (@tauri-apps/cli on this side, tauri-build on the cargo side) opens
      # solo. First matching group wins.
      tauri:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # One PR for routine minor/patch bumps; majors stay separate.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Rust backend (Cargo).
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Cargo.lock lives under src-tauri/, which trips changelog.yml's
    # fragment requirement — auto-apply its designed escape hatch (deps-only
    # bumps have no user-facing changelog entry).
    labels:
      - "dependencies"
      - "no-changelog"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The crate half of the npm `tauri` group above — separate only because
      # groups cannot span ecosystems; combine the two unless this PR carries
      # only crates with no npm counterpart (tauri-build).
      tauri:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
