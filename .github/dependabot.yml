# Keeps dependencies up to date with weekly PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Frontend (pnpm) at the repo root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Hold off on freshly-published releases (supply-chain safety),
    # mirroring pnpm's minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR for routine minor/patch bumps; majors stay separate.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # The npm updater converges on ONE version per dependency name across the
    # whole pnpm workspace and rewrites every manifest to it. That is harmless
    # only while root and site/ agree on a major: site's vite must track the one
    # astro depends on directly. If the majors ever diverge again, restore a
    # name-only `ignore` for vite (never `versions: ["<N"]` — that inverts the
    # bug into writing the wrong major into site/) and bump both by hand.

  # Rust backend (Cargo).
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Cargo.lock lives under src-tauri/, which trips changelog.yml's
    # fragment requirement — auto-apply its designed escape hatch (deps-only
    # bumps have no user-facing changelog entry).
    labels:
      - "dependencies"
      - "no-changelog"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
