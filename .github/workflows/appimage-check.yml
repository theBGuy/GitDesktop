name: appimage-check

# Builds an unsigned AppImage the way release.yml does, then proves it actually
# runs on a modern-Mesa distro. Dispatch it by hand when touching the Linux
# bundling path; the PR trigger is paths-limited to that path and its toolchain
# inputs, so it never becomes a required check on unrelated work.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/appimage-check.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/pin-linuxdeploy/**"
      - ".github/scripts/appimage-guard.sh"
      - ".github/scripts/appimage-smoke.sh"
      - ".node-version" # setup-node reads the Node version from it
      # The Tauri CLI (resolved in the lockfile) embeds the GTK hook and names
      # the AppRun and linuxdeploy builds; bundle config picks which hooks run.
      - "src-tauri/tauri.conf.json"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appimage:
    # Paired with release.yml's Linux leg by convention only — nothing enforces
    # it, so a runner bump there must be mirrored here or this proves nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          # AWS-placed runners get a regional EC2 archive mirror that ran at 59-95 kB/s
          # on this list (13-21 min, run 44371845274); Canonical's hosts were fast there.
          ec2_host='[a-z0-9-]+\.ec2\.archive\.ubuntu\.com'
          apt_files=(/etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
          mapfile -d '' -t ec2_lists < <(sudo grep -lZE "://$ec2_host/" "${apt_files[@]}" 2>/dev/null || true)
          if [ "${#ec2_lists[@]}" -eq 0 ]; then
            echo "apt: no EC2 regional mirror configured"
          elif sudo sed -i -E "s#://$ec2_host/#://archive.ubuntu.com/#g" "${ec2_lists[@]}"; then
            printf 'apt: EC2 regional mirror replaced in:\n'
            printf '%s\n' "${ec2_lists[@]}"
          else
            echo "apt: EC2 mirror rewrite failed; continuing with the files as they are"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      - name: Pin the bundler's AppImage tools (hash-verified)
        uses: ./.github/actions/pin-linuxdeploy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts in tauri.conf.json would demand the signing key;
      # the inline override drops it without affecting the bundle's contents.
      - name: Build unsigned AppImage
        run: pnpm tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Guard the AppImage bundle and its startup env
        shell: bash
        run: bash .github/scripts/appimage-guard.sh

      - name: Run the AppImage on modern Mesa
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit 2>/dev/null || true)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -e APPIMAGE="/work/${appimage:?no AppImage found}" \
            fedora:44 bash /work/.github/scripts/appimage-smoke.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-unsigned
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
