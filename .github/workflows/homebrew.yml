name: homebrew

# On each published (non-prerelease) release, sync the personal tap's cask
# (theBGuy/homebrew-tap, Casks/gitdesktop.rb) to the new version: download the
# universal dmg asset, recompute its sha256, rewrite the version/sha256
# stanzas, and push. Requires HOMEBREW_TAP_TOKEN — a fine-grained PAT with
# contents read/write on the tap repo; the default GITHUB_TOKEN cannot push
# to a different repository.

on:
  release:
    types: [published]

permissions: {}

# Back-to-back publishes race the tap push (loser fails non-fast-forward);
# queue them instead.
concurrency:
  group: homebrew-cask-bump
  cancel-in-progress: false

jobs:
  bump-cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      # Credentials stay persisted (no `persist-credentials: false` here): the
      # bump step's `git push` authenticates with this checkout's stored token.
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: theBGuy/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask version and sha256
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Stable x.y.z only: release.yml marks every v* tag non-prerelease,
          # so an rc/backport tag would otherwise reach the stable cask.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag ${TAG} is not a stable x.y.z release; skipping cask bump."; exit 0; }
          URL="https://github.com/theBGuy/GitDesktop/releases/download/${TAG}/GitDesktop_${VERSION}_universal.dmg"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/gitdesktop.dmg "$URL"
          SHA="$(sha256sum /tmp/gitdesktop.dmg | cut -d' ' -f1)"
          sed -i -E "s|^  version \".*\"$|  version \"${VERSION}\"|" Casks/gitdesktop.rb
          sed -i -E "s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" Casks/gitdesktop.rb
          # sed exits 0 on zero matches: assert both stanzas landed, or a
          # drifted cask ships stale (or half-bumped, failing every install).
          grep -Fq "  version \"${VERSION}\"" Casks/gitdesktop.rb || { echo "version stanza drifted in Casks/gitdesktop.rb"; exit 1; }
          grep -Fq "  sha256 \"${SHA}\"" Casks/gitdesktop.rb || { echo "sha256 stanza drifted in Casks/gitdesktop.rb"; exit 1; }
          if git diff --quiet; then
            echo "Cask already at ${VERSION}; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gitdesktop.rb
          git commit -m "gitdesktop ${VERSION}"
          git push
