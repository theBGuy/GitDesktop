name: rust-tests

# Cross-platform Rust CI: runs the tests + `cargo clippy` on Windows, Linux, and
# macOS for every change to the Tauri backend (`cargo test` on Linux, doctests
# included; two nextest shards each on Windows and macOS). This is the only
# place the `#[cfg(unix)]` modules and other cfg-gated behavior get compiled and
# exercised off Windows — local verification is Windows-only. Deliberately
# bare-bones: no frontend test runner, no e2e, no release logic (that lives in
# release.yml).
#
# A cheap `gate` job runs first and skips the (billed 2×/10× on Windows/macOS)
# matrix whenever the exact Rust content was ALREADY proven green — see the job
# comment below. This kills two redundancies: the post-merge `push: master`
# re-run of a PR that just passed (the squash commit's identity equals the
# PR's last tested merge commit's when base did not move `src-tauri` or any
# other identity member since), and a non-Rust follow-up commit
# on a PR re-triggering the whole matrix (the `pull_request` `paths` filter
# matches the cumulative base…head diff, so one earlier Rust commit keeps
# re-arming it).
#
# Only an exact identity may skip: source-reading `include_str!` tests see
# comments and whitespace, so even a comment-only `.rs` edit runs the matrix.
#
# Evidence: the gate signs the checkout the matrix itself tests (the merge
# commit on `pull_request`): its `src-tauri` tree plus the workflow, gate and
# apt-script blobs and the root Rust inputs (`.cargo/config.toml`,
# `.cargo/config`, `rust-toolchain.toml`, `rust-toolchain`, `.gitattributes`),
# each as its blob or absent. `../package.json` (moved by every frontend
# dependency bump) and the stubbed `../dist` stay outside: they can change
# what the matrix runs without changing the identity or tripping the paths
# filter. A base that moved `src-tauri` or any of those members changes the
# identity, so the PR runs unless that exact identity already passed. A gate
# records its identity as an artifact name, kept 14 days, only when the matrix
# will run and decide emitted an identity, and only a green run's artifact
# counts; a skip records nothing, so its evidence ages from the tested run.
# That run's GitHub-recorded head commit must match the same members,
# absences included, so a PR that edits the gate or workflow cannot mint
# evidence its later commits or master trust; code that runs inside the test
# matrix and uploads an artifact itself stays out of reach.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
      - ".github/scripts/apt-prefer-canonical-mirror.sh"
      - "scripts/check-rust-gate.mjs"
      - ".cargo/config.toml"
      - ".cargo/config"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".gitattributes"
  push:
    branches:
      - master
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
      - ".github/scripts/apt-prefer-canonical-mirror.sh"
      - "scripts/check-rust-gate.mjs"
      - ".cargo/config.toml"
      - ".cargo/config"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".gitattributes"

# One in-flight run per ref; a force-push cancels the superseded run instead of
# stacking a second one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # gate reads this workflow's run history and artifacts by name

jobs:
  # The decision lives in scripts/check-rust-gate.mjs: it signs the checked-out
  # commit (the one `test` checks out too) as its `src-tauri` tree plus the
  # workflow, gate-script and apt-script blobs and the root Rust inputs, and
  # skips only when a green run of this workflow recorded that exact identity
  # (header block above). A change to any of those blobs re-keys all evidence.
  # That run's head commit must match the same members, absences included (one
  # tree listing), so an edited gate cannot vouch for later commits; matrix
  # code uploading an artifact is out of reach.
  # The record step uploads the identity only after the decision and only when
  # the matrix will run (the test job's own condition) and decide emitted an
  # identity, so it can never turn a run into a skip and a skip never extends
  # evidence; a failed upload loses a future skip at most.
  # The wiring fails OPEN: `test` skips only on `run=false` from a decide step
  # that succeeded in a gate job that succeeded, so a setup-node failure, a
  # script crash or hang, a missing output or a failed gate job all still run
  # the matrix, and the report step makes the miss visible.
  gate:
    name: gate (skip if this Rust content already passed)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      decided: ${{ steps.decide.outcome }}
    steps:
      # The identity reads HEAD's own tree and blobs, so the default depth-1
      # clone suffices.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Decide whether the matrix must run
        id: decide
        if: steps.node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/check-rust-gate.mjs

      - name: Record the tested checkout's identity
        if: ${{ !cancelled() && steps.decide.outputs.identity != '' && (steps.decide.outcome != 'success' || steps.decide.outputs.run != 'false') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.decide.outputs.identity }}
          path: ${{ runner.temp }}/rust-gate-evidence/identity.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Report a gate that made no decision
        if: ${{ !cancelled() && (steps.decide.outcome != 'success' || steps.decide.outputs.run == '') }}
        env:
          NODE: ${{ steps.node.outcome }}
          DECIDE: ${{ steps.decide.outcome }}
        shell: bash
        run: |
          echo "::error::rust-tests gate made no decision (setup-node: $NODE, decide: $DECIDE); the test matrix runs (fail-open)."

  test:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.decided != 'success' || needs.gate.outputs.run != 'false') }}
    name: test (${{ matrix.platform }}${{ matrix.shard && format(' {0}/2', matrix.shard) || '' }})
    strategy:
      # Each platform is independent signal — one leg failing shouldn't cancel
      # the others; that cross-platform coverage is the whole point.
      fail-fast: false
      # Windows and macOS split their tests into two nextest shards (their legs
      # dominate wall time); both Linux legs keep plain `cargo test`, the only
      # run of the doctests. One leg per platform runs clippy.
      matrix:
        include:
          - platform: windows-2025
            shard: 1
            clippy: true
          - platform: windows-2025
            shard: 2
            clippy: false
          - platform: macos-26
            shard: 1
            clippy: true
          - platform: macos-26
            shard: 2
            clippy: false
          - platform: ubuntu-24.04
            clippy: true
          - platform: ubuntu-26.04
            clippy: true
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Experiment: macOS compiles the test binary ~1.6-2.5x slower than
      # Windows (recent CI logs), and line tables alone keep backtraces
      # readable. Set before the cache step because rust-cache hashes CARGO_*
      # env into its key; the gate skips master's post-merge matrix, so after
      # changing this, re-run that master run once to seed the new cache.
      - name: Trim macOS debug info
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # rust-cache keys on the OS family, not the runner image: without the
          # image in the key, Linux legs share one cache and an image bump
          # restores the previous image's build. Shards share the platform key,
          # so only the clippy leg saves: an exact-key hit never re-saves, and
          # the saved cache must include the dependency builds clippy needs.
          key: ${{ matrix.platform }}
          save-if: ${{ matrix.clippy }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          bash .github/scripts/apt-prefer-canonical-mirror.sh
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      # `tauri.conf.json` sets `frontendDist: "../dist"` and
      # `tauri::generate_context!` embeds that directory at COMPILE time, so
      # `cargo test` fails on a fresh checkout without it. A stub index.html is
      # enough — contents are irrelevant to the Rust tests, and this keeps
      # Node/pnpm out of the test matrix (only the gate job runs Node).
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Install nextest
        if: matrix.shard
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest@0.9.151

      # nextest runs no doctests; the Linux legs' `cargo test` covers them.
      - name: Run tests (nextest shard)
        if: matrix.shard
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --partition slice:${{ matrix.shard }}/2 --no-fail-fast

      - name: Run tests
        if: ${{ !matrix.shard }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run clippy
        if: matrix.clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Release-only code (`cfg(not(debug_assertions))`: the single-instance
      # lock, the managed MCP launcher copy) never compiles in the debug-profile
      # steps above — lint it in release profile so it can't silently rot.
      - name: Run clippy (release-gated code)
        if: matrix.clippy
        run: cargo clippy --release --manifest-path src-tauri/Cargo.toml -- -D warnings
