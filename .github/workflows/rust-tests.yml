name: rust-tests

# Cross-platform Rust CI: runs the tests + `cargo clippy` on Windows, Linux, and
# macOS for every change to the Tauri backend (`cargo test` on Linux, doctests
# included; two nextest shards each on Windows and macOS). This is the only
# place the `#[cfg(unix)]` modules and other cfg-gated behavior get compiled and
# exercised off Windows — local verification is Windows-only. Deliberately
# bare-bones: no frontend test runner, no e2e, no release logic (that lives in
# release.yml).
#
# A cheap `gate` job runs first and skips the (billed 2×/10× on Windows/macOS)
# matrix whenever the exact Rust content was ALREADY proven green — see the job
# comment below. This kills two redundancies: the post-merge `push: master`
# re-run of a PR that just passed (the squash commit's `src-tauri` tree is
# byte-identical to the PR head's), and a non-Rust follow-up commit on a PR
# re-triggering the whole matrix (the `pull_request` `paths` filter matches the
# cumulative base…head diff, so one earlier Rust commit keeps re-arming it).
#
# Second tier: when NO byte-identical green tree exists, the gate also skips if
# the delta vs a green run is comment-or-formatting-only in `.rs` files — i.e.
# the two `src-tauri` trees differ only in files ending `.rs`, and each such
# file is EQUIVALENT under `.github/scripts/canonicalize-rust.py` (doc comments
# and every string/char literal are preserved byte-verbatim; ordinary comments
# and all whitespace/reflow are dropped). Any non-`.rs` change, add/delete/
# rename, or non-equivalent `.rs` file forces the matrix. Motivating case: a
# comment-only follow-up commit (real example: `1eff119`, four `//` lines added
# to `src/git/remote.rs`) that today re-runs the whole 3-OS matrix for a
# foregone conclusion.
#
# ACCEPTED RISK (stated honestly): this tier slightly weakens the first tier's
# "worst case is a redundant run" guarantee, because a few lint/test signals
# live OUTSIDE the canonicalizer's equivalence — whitespace-adjacent clippy
# lints (e.g. `suspicious_else_formatting`, `empty_line_after_outer_attr`) and
# panic-message line numbers. Comment-KEYED clippy lints (e.g.
# `undocumented_unsafe_blocks`, which keys on `// SAFETY:` comments) would also
# live outside the equivalence — none are enabled today (no `[lints]` section,
# no clippy.toml; verified 2026-07-18), so enabling one later must re-evaluate
# this gate. Mitigations: the repo uses no `line!()` / `include_str!()` (audited
# 2026-07-18); doc comments are preserved because the crate's rlib target runs
# doc tests; any canonicalizer anomaly fails OPEN (runs the matrix); and "Re-run
# all jobs" always forces the matrix.
#
# Base-drift caveat (pre-existing frame, applies to BOTH passes, not new to tier
# 2): on `pull_request` the gate signs the PR HEAD tree while the matrix builds
# the MERGE ref, so a skip forgoes re-validating the head against a base that
# advanced since the candidate green. The post-merge `push: master` run is the
# backstop — it builds the true merged tree and cannot inherit such a skip,
# because base code changes make the merged tree non-equivalent to the PR head
# tree (a different `src-tauri` tree, hence a real matrix run).

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
      - ".github/scripts/canonicalize-rust.py"
      - "scripts/check-rust-gate.mjs"
  push:
    branches:
      - master
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
      - ".github/scripts/canonicalize-rust.py"
      - "scripts/check-rust-gate.mjs"

# One in-flight run per ref; a force-push cancels the superseded run instead of
# stacking a second one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # gate reads this workflow's own run history

jobs:
  # The decision lives in scripts/check-rust-gate.mjs: pass 1 skips when an
  # identical `src-tauri` tree already passed under the same workflow,
  # gate-script and canonicalizer blobs, pass 2 when the delta vs a green with
  # those same blobs is comment/format-only `.rs` (header block above). The
  # gate and canonicalizer blobs are in the identity, so a change to either
  # re-runs the matrix, as does a merge commit whose gate or workflow differs
  # from the PR head's (a PR green is listed by head SHA but ran its merge
  # commit, a limit the script header names). The wiring fails OPEN: `test`
  # skips only on `run=false` from a decide step that succeeded in a gate job
  # that succeeded, so a setup-node failure, a script crash or hang, a missing
  # output or a failed gate job all still run the matrix, and the report step
  # makes the miss visible.
  gate:
    name: gate (skip if this Rust content already passed)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      decided: ${{ steps.decide.outcome }}
    steps:
      # fetch-depth: 0 pulls all branches/tags, so every past green run's commit
      # (PR-branch heads included — branches aren't deleted on merge) is present
      # locally for the tree lookups below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Decide whether the matrix must run
        id: decide
        if: steps.node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/check-rust-gate.mjs

      - name: Report a gate that made no decision
        if: ${{ !cancelled() && (steps.decide.outcome != 'success' || steps.decide.outputs.run == '') }}
        env:
          NODE: ${{ steps.node.outcome }}
          DECIDE: ${{ steps.decide.outcome }}
        shell: bash
        run: |
          echo "::error::rust-tests gate made no decision (setup-node: $NODE, decide: $DECIDE); the test matrix runs (fail-open)."

  test:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.decided != 'success' || needs.gate.outputs.run != 'false') }}
    name: test (${{ matrix.platform }}${{ matrix.shard && format(' {0}/2', matrix.shard) || '' }})
    strategy:
      # Each platform is independent signal — one leg failing shouldn't cancel
      # the others; that cross-platform coverage is the whole point.
      fail-fast: false
      # Windows and macOS split their tests into two nextest shards (their legs
      # dominate wall time); both Linux legs keep plain `cargo test`, the only
      # run of the doctests. One leg per platform runs clippy.
      matrix:
        include:
          - platform: windows-2025
            shard: 1
            clippy: true
          - platform: windows-2025
            shard: 2
            clippy: false
          - platform: macos-26
            shard: 1
            clippy: true
          - platform: macos-26
            shard: 2
            clippy: false
          - platform: ubuntu-24.04
            clippy: true
          - platform: ubuntu-26.04
            clippy: true
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Experiment: macOS compiles the test binary ~1.6-2.5x slower than
      # Windows (recent CI logs), and line tables alone keep backtraces
      # readable. Set before the cache step because rust-cache hashes CARGO_*
      # env into its key; the gate skips master's post-merge matrix, so after
      # changing this, re-run that master run once to seed the new cache.
      - name: Trim macOS debug info
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # rust-cache keys on the OS family, not the runner image: without the
          # image in the key, Linux legs share one cache and an image bump
          # restores the previous image's build. Shards share the platform key,
          # so only the clippy leg saves: an exact-key hit never re-saves, and
          # the saved cache must include the dependency builds clippy needs.
          key: ${{ matrix.platform }}
          save-if: ${{ matrix.clippy }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # AWS-placed runners get a regional EC2 archive mirror that ran at 59-95 kB/s
          # on this list (13-21 min, run 44371845274); Canonical's hosts were fast there.
          ec2_host='[a-z0-9-]+\.ec2\.archive\.ubuntu\.com'
          apt_files=(/etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
          mapfile -d '' -t ec2_lists < <(sudo grep -lZE "://$ec2_host/" "${apt_files[@]}" 2>/dev/null || true)
          if [ "${#ec2_lists[@]}" -eq 0 ]; then
            echo "apt: no EC2 regional mirror configured"
          elif sudo sed -i -E "s#://$ec2_host/#://archive.ubuntu.com/#g" "${ec2_lists[@]}"; then
            printf 'apt: EC2 regional mirror replaced in:\n'
            printf '%s\n' "${ec2_lists[@]}"
          else
            echo "apt: EC2 mirror rewrite failed; continuing with the files as they are"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      # `tauri.conf.json` sets `frontendDist: "../dist"` and
      # `tauri::generate_context!` embeds that directory at COMPILE time, so
      # `cargo test` fails on a fresh checkout without it. A stub index.html is
      # enough — contents are irrelevant to the Rust tests, and this keeps
      # Node/pnpm out of the test matrix (only the gate job runs Node).
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Install nextest
        if: matrix.shard
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest@0.9.151

      # nextest runs no doctests; the Linux legs' `cargo test` covers them.
      - name: Run tests (nextest shard)
        if: matrix.shard
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --partition slice:${{ matrix.shard }}/2 --no-fail-fast

      - name: Run tests
        if: ${{ !matrix.shard }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run clippy
        if: matrix.clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Release-only code (`cfg(not(debug_assertions))`: the single-instance
      # lock, the managed MCP launcher copy) never compiles in the debug-profile
      # steps above — lint it in release profile so it can't silently rot.
      - name: Run clippy (release-gated code)
        if: matrix.clippy
        run: cargo clippy --release --manifest-path src-tauri/Cargo.toml -- -D warnings
