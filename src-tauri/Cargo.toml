[package]
name = "gitdesktop"
version = "0.8.0"
description = "A fast, native desktop Git client"
authors = ["theBGuy"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
# Single-instance lock (release builds only — gated at the registration site in
# lib.rs, since Cargo target tables can't key on `debug_assertions`).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
trash = "5"
tokio = { version = "1", features = ["process", "time", "macros", "sync", "rt-multi-thread", "io-std"] }
thiserror = "2"
base64 = "0.23.1"
tauri-plugin-notification = "2.3.3"
os_info = "3"
portable-pty = "0.9"
# Tier-3 "GitDesktop AS an MCP server" — the read-only stdio server reached via the
# `gitdesktop mcp` subcommand (see main.rs + docs/mcp-server-tier3.md). Linked into
# the main binary so a shipped app can act as an MCP server with nothing extra to bundle.
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
# Local-PR MCP write core (local_prs.rs): resolve the same app-data dir the store
# plugin writes (dirs, matching Tauri's BaseDirectory::AppData = dirs::data_dir()),
# mint record ids (uuid v4, matching the frontend's crypto.randomUUID()), and stamp
# createdAt in JS `toISOString()` format (chrono RFC3339 millis + Z). All already in
# the tree transitively; declared here as direct deps for the MCP-server code paths.
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# GitLab multi-line diff-note ranges: a `position.line_range` ref's `line_code` is
# `sha1_hex(file_path)_<old_pos>_<new_pos>` (see forge/gitlab.rs `gl_line_code`).
# RustCrypto sha1 — hashing only, no extra default features needed.
sha1 = "0.11"
# The AI-ignore gitignore engine evaluates patterns in a throwaway EMPTY repo, so
# only the user's patterns apply (git::ai_ignore). TempDir gives it an
# unpredictable, exclusively-created path: a guessable one in a shared /tmp lets a
# local attacker pre-seed `.git/info/exclude`, which outranks core.excludesFile and
# would silently un-ignore a file. Test fixtures use it as RAII temp dirs too, so
# a killed or panicking run leaks nothing.
tempfile = "3"

# Desktop-only: the updater plugin doesn't build for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Windows-only: re-read the live user/system PATH from the registry so the CLI
# resolver can find a tool added to PATH AFTER the app launched (Windows never
# pushes PATH edits into a running process). See agent.rs `registry_path_dirs`.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Broadcasting WM_SETTINGCHANGE so a freshly-added PATH entry (the "add gitdesktop
# to PATH" launcher) reaches new terminals without a logout (path_launcher.rs), and
# job objects so a timed-out git takes its whole process tree with it (runner.rs).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_UI_WindowsAndMessaging",
] }

# Vendored portable-pty carrying a 1-line Windows ConPTY fix: pass NULL (not
# INVALID_HANDLE_VALUE) std handles when spawning the pty child, so it attaches to
# the pseudoconsole instead of allocating its own console window (which left the
# in-app terminal's output empty and "exited" immediately). See the patch comment in
# vendor/portable-pty/src/win/psuedocon.rs. Drop this when fixed upstream (wezterm).
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
