[package]
name = "gitdesktop"
version = "0.4.0"
description = "A fast, native desktop Git client"
authors = ["theBGuy"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
# Single-instance lock (release builds only — gated at the registration site in
# lib.rs, since Cargo target tables can't key on `debug_assertions`).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
trash = "5"
tokio = { version = "1", features = ["process", "time", "macros", "sync", "rt-multi-thread", "io-std", "net"] }
thiserror = "2"
base64 = "0.22.1"
tauri-plugin-notification = "2.3.3"
os_info = "3"
portable-pty = "0.9"
# Tier-3 "GitDesktop AS an MCP server" — the read-only stdio server reached via the
# `gitdesktop mcp` subcommand (see main.rs + docs/mcp-server-tier3.md). Linked into
# the main binary so a shipped app can act as an MCP server with nothing extra to bundle.
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
# Local-PR MCP write core (local_prs.rs): resolve the same app-data dir the store
# plugin writes (dirs, matching Tauri's BaseDirectory::AppData = dirs::data_dir()),
# mint record ids (uuid v4, matching the frontend's crypto.randomUUID()), and stamp
# createdAt in JS `toISOString()` format (chrono RFC3339 millis + Z). All already in
# the tree transitively; declared here as direct deps for the MCP-server code paths.
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# GitLab multi-line diff-note ranges: a `position.line_range` ref's `line_code` is
# `sha1_hex(file_path)_<old_pos>_<new_pos>` (see forge/gitlab.rs `gl_line_code`).
# RustCrypto sha1 — hashing only, no extra default features needed.
sha1 = "0.10"
# LAN phone-companion server (src/lan/): an embedded, default-OFF axum HTTP server
# that lets a paired phone read the active repo over the LAN. The reviews monitor
# is a Server-Sent-Events stream (axum's built-in `Sse`, no extra feature), NOT a
# WebSocket — SSE is one-way (all this route needs) and, unlike `wss:`, an
# `EventSource` rides a self-signed-cert exception on iOS Safari. `sha2`/`rand`
# back the pairing challenge/response + bearer tokens; `qrcode` renders the pairing
# QR as an inline SVG (svg-only — no `image` default feature); `local-ip-address`
# enumerates the machine's LAN IPv4s for the advertised urls; `futures-util`
# powers the hand-rolled SSE event stream (`stream::unfold`).
axum = "0.8.9"
sha2 = "0.11.0"
rand = "0.10.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
local-ip-address = "0.6.13"
futures-util = "0.3.32"
# LAN companion TLS (src/lan/tls.rs): the phone browser needs a secure context
# (`crypto.subtle`, no mixed-content), so the server speaks HTTPS with a persistent
# self-signed cert the user excepts once (TOFU). `rcgen` mints the cert — KEEP its
# default features (crypto+pem+ring); its `aws_lc_rs` feature is deliberately NOT
# enabled (aws-lc-rs needs NASM/CMake on Windows MSVC, which our 3-OS CI must stay
# free of). `axum-server` serves it over the pre-bound TcpListener with graceful
# shutdown — the `tls-rustls-no-provider` feature (NOT plain `tls-rustls`, which
# would pull `rustls/aws-lc-rs` into the tree) keeps us ring-only. `rustls` is a
# direct dep so we build the `ServerConfig` with an EXPLICIT ring provider (not the
# process-global default) — hence `default-features = false` + `ring`; `std`/`tls12`/
# `logging` are the plain-server essentials. `rustls-pki-types` (already transitive)
# is direct for its PEM parser (`PemObject`) that turns the stored cert/key back into
# rustls DER types on reuse.
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Embeds the companion frontend bundle (src-tauri/companion-dist/, written by the
# sibling `pnpm build:companion`) into the binary so a shipped app serves the phone
# UI with nothing extra to ship. `mime-guess` powers `EmbeddedFile::metadata().mimetype()`
# for the Content-Type of served assets. In DEBUG builds rust-embed reads the folder
# from disk at request time (no rebuild needed to pick up a fresh frontend build) — that
# IS the dev loop; RELEASE builds bake the files in.
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
# Keep the desktop awake while the LAN companion is sharing (src/lan/keep_awake.rs):
# the phone's value is unattended monitoring, so the machine must not sleep mid-watch.
# `keepawake` requests a system-stays-awake hold (display may still sleep) via the OS
# power API — `SetThreadExecutionState` on Windows (drags a pure-Rust `windows` crate,
# Win32_System_Power only), IOKit on macOS, org.freedesktop inhibit (zbus) on Linux —
# all pure-Rust, no aws-lc/NASM, 3-OS CI-safe. RAII guard released on Drop; held on a
# dedicated thread because the Windows API is thread-affine (see keep_awake.rs).
keepawake = "0.6"

# Desktop-only: the updater plugin doesn't build for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Windows-only: re-read the live user/system PATH from the registry so the CLI
# resolver can find a tool added to PATH AFTER the app launched (Windows never
# pushes PATH edits into a running process). See agent.rs `registry_path_dirs`.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Broadcasting WM_SETTINGCHANGE so a freshly-added PATH entry (the "add gitdesktop
# to PATH" launcher) reaches new terminals without a logout. See path_launcher.rs.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# Vendored portable-pty carrying a 1-line Windows ConPTY fix: pass NULL (not
# INVALID_HANDLE_VALUE) std handles when spawning the pty child, so it attaches to
# the pseudoconsole instead of allocating its own console window (which left the
# in-app terminal's output empty and "exited" immediately). See the patch comment in
# vendor/portable-pty/src/win/psuedocon.rs. Drop this when fixed upstream (wezterm).
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

# `tower::ServiceExt::oneshot` drives the LAN router in unit tests without opening
# a socket (auth/host/allowlist assertions in src/lan/). `futures-util` (a direct
# dependency above, for the SSE stream) also reads the router's SSE body
# incrementally in the reviews-monitor test.
[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# The real-socket TLS smoke test (src/lan/mod.rs) drives the started server over an
# actual `https://` connection to prove the rustls handshake + serve loop + auth
# chain all work end-to-end (the oneshot router tests are transport-agnostic). 0.12
# is already in the graph via tauri-plugin-http, so this is near-zero extra compile;
# `rustls-tls` (no default features) keeps it off the native-TLS / aws-lc path.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# RAII temp dirs for the TLS-material tests (src/lan/tls.rs): a killed or panicking
# test run must not leak private-key material into the system temp dir — `TempDir`
# removes the directory on Drop. Already in the graph transitively, so near-zero cost.
tempfile = "3"
